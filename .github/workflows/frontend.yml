name: Frontend
on:
  workflow_dispatch:
  workflow_call:
jobs:
  Frontend:
    # Pinned: ubuntu-latest is now Ubuntu 26.04, where the Playwright version we
    # use cannot install Chromium. Go back to ubuntu-latest after upgrading it.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Cache the node_modules dir
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('yarn.lock') }}

    - name: Install
      run: yarn install --frozen-lockfile && yarn playwright install chromium

    - name: Format
      run: yarn checkformatting

    - name: Lint
      run: yarn lint

    - name: Typecheck
      run: yarn typecheck

    - name: Test
      run: yarn test
